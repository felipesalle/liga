                        doc.setFontSize(12);
                        if (homeFlagB64) doc.addImage(homeFlagB64, 'PNG', 40, y - 5, 10, 10);
                        doc.text(getTeamName(match.homeTeamId), 55, y);
                        doc.text("vs", pageCenter, y, { align: 'center' });
                        if (awayFlagB64) doc.addImage(awayFlagB64, 'PNG', 160, y - 5, 10, 10);
                        doc.text(getTeamName(match.awayTeamId), 145, y, { align: 'right' });
                        y += 20;
                    }
                }
                doc.save(`proximos_partidos_${selectedTournamentId}.pdf`);
                showMessage("PDF de Próximos Partidos generado.");
            };

            const generateRefereeSheetPdf = async (visibleMatches, visiblePlayers) => {
                if (!refereeMatchDate) {
                    showMessage("Selecciona una fecha para la cédula.");
                    return;
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const pageCenter = doc.internal.pageSize.getWidth() / 2;
                const logoUrl = 'https://i.imgur.com/pbiHVPL.png';
                const logoData = await urlToB64(logoUrl);

                const filteredMatches = visibleMatches
                    .filter(match => match.date === refereeMatchDate)
                    .sort((a, b) => {
                        const leagueA = getLeagueName(a.leagueId);
                        const leagueB = getLeagueName(b.leagueId);
                        const leagueOrder = ['1ro A', '1ro B', '2do A', '2do B', '3ro A', '3ro B', '4to A', '4to B', 'QB', 'FM', 'CSH', 'EA', 'SCH'];
                        return leagueOrder.indexOf(leagueA) - leagueOrder.indexOf(leagueB);
                    });

                if (filteredMatches.length === 0) {
                    showMessage("No hay partidos para la fecha seleccionada.");
                    return;
                }

                let matchCount = 0;
                for (const match of filteredMatches) {
                    const isFirstOnPage = matchCount % 2 === 0;

                    if (matchCount > 0 && isFirstOnPage) {
                        doc.addPage();
                    }

                    const yOffset = isFirstOnPage ? 15 : 150;
                    let y = yOffset;
                    
                    const [homeFlagB64, awayFlagB64] = await Promise.all([urlToB64(getTeamFlag(match.homeTeamId)), urlToB64(getTeamFlag(match.awayTeamId))]);

                    if (logoData) doc.addImage(logoData, 'PNG', 15, y - 5, 20, 20);

                    doc.setFontSize(16).text("Cédula de Partido", pageCenter, y, { align: 'center' });
                    y += 8;
                    doc.setFontSize(10).text(`Liga: ${getLeagueName(match.leagueId)}`, 40, y);
                    doc.text(`Fecha: ${match.date}`, 195, y, { align: 'right' });
                    y += 5;
                    
                    doc.setLineWidth(0.5).line(15, y, 195, y);
                    y += 8;

                    const homeTeamName = getTeamName(match.homeTeamId);
                    const awayTeamName = getTeamName(match.awayTeamId);

                    if (homeFlagB64) doc.addImage(homeFlagB64, 'PNG', 45, y, 12, 12);
                    doc.setFontSize(11).text(homeTeamName, 60, y + 8);

                    doc.setFontSize(11).text("VS", pageCenter, y + 8, { align: 'center' });

                    if (awayFlagB64) doc.addImage(awayFlagB64, 'PNG', 153, y, 12, 12);
                    doc.setFontSize(11).text(awayTeamName, 148, y + 8, { align: 'right' });
                    
                    y += 20;

                    const homeTeamPlayers = getPlayersByTeam(match.homeTeamId).filter(p => visiblePlayers.some(vp => vp.id === p.id)).map(p => [p.name, '']);
                    const awayTeamPlayers = getPlayersByTeam(match.awayTeamId).filter(p => visiblePlayers.some(vp => vp.id === p.id)).map(p => [p.name, '']);

                    doc.autoTable({
                        startY: y,
                        head: [['Jugadores Local', 'N']],
                        body: homeTeamPlayers,
                        theme: 'grid',
                        margin: { left: 15, right: 110 },
                        styles: { fontSize: 8, cellPadding: 1 },
                        headStyles: { fillColor: [22, 160, 133], fontSize: 9 },
                        columnStyles: { 1: { cellWidth: 10 } }
                    });

                    doc.autoTable({
                        startY: y,
                        head: [['Jugadores Visitante', 'N']],
                        body: awayTeamPlayers,
                        theme: 'grid',
                        margin: { left: 110, right: 15 },
                        styles: { fontSize: 8, cellPadding: 1 },
                        headStyles: { fillColor: [22, 160, 133], fontSize: 9 },
                        columnStyles: { 1: { cellWidth: 10 } }
                    });

                    y = doc.autoTable.previous.finalY + 7;

                    doc.setFontSize(9).text("Marcador Final:", 15, y);
                    doc.rect(45, y - 3, 20, 7);
                    doc.text("Observaciones:", 75, y);
                    doc.rect(100, y - 3, 95, 12);
                    y += 15;
                    
                    doc.line(20, y, 80, y);
                    doc.setFontSize(9).text("Firma Árbitro", 40, y + 4);
                    doc.line(120, y, 180, y);
                    doc.setFontSize(9).text("Firma Capitán", 140, y + 4);
                    
                    matchCount++;
                }

                doc.save(`cedula_arbitro_${refereeMatchDate}.pdf`);
                showMessage("Cédula de Árbitro generada.");
            };

            const generateStandingsAndTopScorersPdf = async (visibleLeagues, visibleTeams, visibleMatches, visiblePlayers) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const logoUrl = 'https://i.imgur.com/pbiHVPL.png';
                const logoData = await urlToB64(logoUrl);

                visibleLeagues.sort(sortLeagues).forEach((league, index) => {
                    let y = 20;
                    if (index > 0) { 
                        doc.addPage(); 
                    }
                    if (logoData) doc.addImage(logoData, 'PNG', 170, 10, 25, 25);
                    doc.setFontSize(18).text(`Reporte de Torneo: ${tournaments.find(t => t.id === selectedTournamentId)?.name || ''}`, 10, y, { maxWidth: 150 }); y += 15;

                    doc.setFontSize(16).text(`Liga: ${league.name}`, 10, y, { maxWidth: 150 }); y += 10;

                    doc.setFontSize(14).text("Clasificación:", 15, y); y += 7;
                    const standings = calculateStandings(league.id, visibleTeams, visibleMatches);
                    if (standings.length === 0) { doc.text("No hay datos.", 20, y); y += 10; } 
                    else { doc.autoTable({ startY: y, head: [['Equipo', 'PJ', 'G', 'E', 'P', 'GF', 'GC', 'DG', 'Pts']], body: standings.map(t => [t.teamName, t.played, t.wins, t.draws, t.losses, t.goalsFor, t.goalsAgainst, t.goalDifference, t.points]), theme: 'grid', margin: { left: 15 }, tableWidth: 180 }); y = doc.autoTable.previous.finalY + 10; }

                    if (y > 220) { doc.addPage(); y = 20; if (logoData) doc.addImage(logoData, 'PNG', 170, 10, 25, 25); }

                    const info = getSportScoringInfo(league.sport);

                    } else {
                        doc.setFontSize(14).text(`Tabla de ${info.term}:`, 15, y); y += 7;
                        const scorers = calculateTopScorers(league.id, visibleMatches, visiblePlayers);
                        if (scorers.length === 0) { doc.text("No hay datos.", 20, y); y += 10; }
                        else { doc.autoTable({ startY: y, head: [['Jugador', 'Equipo', info.term]], body: scorers.map(s => [s.playerName, s.teamName, s.goals]), theme: 'grid', margin: { left: 15 }, tableWidth: 180 }); y = doc.autoTable.previous.finalY + 10; }
                    }
                });
                doc.save(`reporte_torneo_${selectedTournamentId}.pdf`);
                showMessage("PDF de Reporte de Torneo generado.");

            const generateTeamsAndPlayersPdf = async (visibleLeagues, visibleTeams, visiblePlayers) => {

                                        <div>

                                            <select value={selectedSemester} onChange={(e) => setSelectedSemester(e.target.value)} className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#101097] bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white transition-colors">
                                                <option value="1">1er Semestre (Sep - Dic: 1ro, 3ro, Áreas)</option>
                                                <option value="2">2do Semestre (Feb - Jun: 2do, 4to, Áreas)</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex justify-end mt-4">
                                        <button onClick={createLeaguesAndTeams} className="btn-primary flex items-center"><PlusIcon className="inline-block w-5 h-5 mr-2" />Crear Torneo</button>
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg space-y-4 border-t-4 border-[#101097]">
                                    <h3 className="text-2xl font-bold text-gray-900 dark:text-white">Copia de Seguridad</h3>
                                    <p className="text-gray-600 dark:text-gray-300">Exporta o importa todos los datos del torneo actual (ligas, equipos, jugadores, partidos).</p>
                                    <div className="flex space-x-4">
                                        <button onClick={handleExportData} className="btn-primary">Exportar Datos</button>
                                        <button onClick={() => document.getElementById('import-file-input').click()} className="btn-primary">Importar Datos</button>
                                        <input type="file" id="import-file-input" accept=".json" style={{ display: 'none' }} onChange={handleImportData} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: PLANTILLAS & EQUIPOS */}
                        {adminSubTab === 'teams' && (
                            <div className="space-y-6">
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg space-y-4 border-t-4 border-[#101097]">
                                    <h3 className="text-2xl font-bold text-gray-900 dark:text-white">Gestión de Equipos y Jugadores ({activeTournament?.name || 'Torneo Actual'})</h3>
                                    {visibleLeagues.length === 0 ? (
                                        <p className="text-center text-gray-500 dark:text-gray-400 py-4">No hay ligas en este torneo. Selecciona o crea un torneo en la pestaña 'Torneos & Backup'.</p>
                                    ) : (
                                        visibleLeagues.map(league => (
                                            <LeagueCard key={league.id} league={league} teams={visibleTeams.filter(t => t.leagueId === league.id)} players={visiblePlayers} appId={appId} db={window.firebaseApp.db} showMessage={showMessage} onMatchDayChange={handleMatchDayChange} onBulkAddPlayers={setTeamForBulkAdd} onEditTeamCountry={setTeamForCountryEdit} />
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: CALENDARIO & PARTIDOS */}
                        {adminSubTab === 'matches' && (
                            <div className="space-y-6">
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg space-y-4 border-t-4 border-[#101097]">
                                    <h3 className="text-2xl font-bold text-gray-900 dark:text-white">Generar Calendario</h3>
                                    {visibleMatches.filter(m => m.type !== 'playoff').length > 0 ? (
                                        <div>
                                            <p className="text-gray-600 dark:text-gray-300 mb-4">Ya existe un calendario para este torneo. Para generar uno nuevo, primero debes borrar el actual.</p>
                                            <button onClick={() => handleDeleteSchedule(visibleLeagueIds)} className="btn-danger flex items-center"><TrashIcon className="inline-block w-5 h-5 mr-2" />Borrar Calendario Actual</button>
                                        </div>
                                    ) : (
                                        <div>
                                            <p className="text-gray-600 dark:text-gray-300">Selecciona una fecha de inicio y genera el calendario para el torneo actual.</p>
                                            <div className="flex items-center space-x-4 mt-4">
                                                <label htmlFor="start-date-input" className="text-sm font-medium text-gray-700 dark:text-gray-300">Fecha de Inicio:</label>
                                                <input type="date" id="start-date-input" value={scheduleStartDate} onChange={(e) => setScheduleStartDate(e.target.value)} className="p-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" />
                                                <button onClick={() => generateSchedule(visibleLeagues, visibleTeams)} className="btn-primary flex items-center"><CalendarIcon className="inline-block w-5 h-5 mr-2" />Generar Calendario</button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg space-y-4 border-t-4 border-[#101097]">
                                    <h3 className="text-2xl font-bold text-gray-900 dark:text-white">Registro y Marcadores de Partidos</h3>
                                    <div className="flex items-center space-x-4 mb-4">
                                        <input type="date" value={selectedDateFilter} onChange={(e) => setSelectedDateFilter(e.target.value)} className="p-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" placeholder="Filtrar por fecha" />
                                        <select value={selectedLeagueFilter} onChange={(e) => setSelectedLeagueFilter(e.target.value)} className="p-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white">
                                            <option value="">Todas las Ligas</option>
                                            {visibleLeagues.sort(sortLeagues).map(league => <option key={league.id} value={league.id}>{league.name}</option>)}
                                        </select>
                                    </div>
                                    <MatchesView matches={visibleMatches} leagues={visibleLeagues} teams={visibleTeams} players={visiblePlayers} getLeagueName={getLeagueName} getTeamName={getTeamName} getPlayersByTeam={getPlayersByTeam} appId={appId} db={window.firebaseApp.db} showMessage={showMessage} selectedDateFilter={selectedDateFilter} selectedLeagueFilter={selectedLeagueFilter} onMatchSaved={checkForFinalsGeneration} />
                                </div>
                            </div>
                        )}

                        {/* TAB 4: REPORTES & PDFS */}
                        {adminSubTab === 'reports' && (
                            <div className="space-y-6">
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg space-y-4 border-t-4 border-[#101097]">
                                    <h3 className="text-2xl font-bold text-gray-900 dark:text-white">Cédula de Partidos para Árbitros</h3>
                                    <p className="text-gray-600 dark:text-gray-300">Generar cédula oficial con planillas de jugadores y firmas para una fecha específica.</p>
                                    <div className="flex items-center space-x-4">
                                        <label className="text-sm font-medium text-gray-700 dark:text-gray-300">Fecha del Partido:</label>
                                        <input type="date" value={refereeMatchDate} onChange={(e) => setRefereeMatchDate(e.target.value)} className="p-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" />
                                        <button onClick={() => generateRefereeSheetPdf(visibleMatches, visiblePlayers)} className="btn-primary">Generar Cédula PDF</button>
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg space-y-4 border-t-4 border-[#101097]">
                                    <h3 className="text-2xl font-bold text-gray-900 dark:text-white">Informes e Impresiones del Torneo</h3>
                                    <p className="text-gray-600 dark:text-gray-300">Generar informes en PDF para el torneo actual.</p>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 dark:text-gray-300">Fecha Inicio:</label>
                                            <input type="date" value={reportStartDate} onChange={(e) => setReportStartDate(e.target.value)} className="w-full mt-1 p-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" />
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 dark:text-gray-300">Fecha Fin:</label>
                                            <input type="date" value={reportEndDate} onChange={(e) => setReportEndDate(e.target.value)} className="w-full mt-1 p-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" />
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap gap-4">
                                        <button onClick={() => generateUpcomingMatchesPdf(visibleMatches)} className="btn-primary">PDF Próximos Partidos</button>
                                        <button onClick={() => generateStandingsAndTopScorersPdf(visibleLeagues, visibleTeams, visibleMatches, visiblePlayers)} className="btn-primary">PDF Clasificación y Goleo</button>
                                        <button onClick={() => generateTeamsAndPlayersPdf(visibleLeagues, visibleTeams, visiblePlayers)} className="btn-primary">PDF Plantillas de Equipos</button>
                                    </div>
                                </div>

                                {/* Seccion Resumen de la Jornada para Redes Sociales */}
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg space-y-4 border-t-4 border-[#101097]">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-2xl font-bold text-gray-900 dark:text-white flex items-center">
                                            📱 Resumen de la Jornada para Redes Sociales (Facebook / Instagram)
                                        </h3>
                                    </div>
                                    <p className="text-gray-600 dark:text-gray-300">Genera un póster gráfico HD o copia el resumen estructurado listo para publicar en redes.</p>
                                    <div className="flex flex-wrap gap-4">
                                        {/* Boton 1: Generar Poster Visual */}
                                        <button 
                                            onClick={() => printFacebookSummaryWindow(visibleMatches, visibleLeagues, visibleTeams, visiblePlayers, selectedDateFilter, 'Preparatoria Tuxtla', activeTournament?.sport || 'Fútbol')} 
                                            className="btn-primary flex-1 min-w-[220px] flex items-center justify-center bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-700 hover:to-amber-800 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all"
                                        >
                                            🖼️ Generar Póster Visual (Imprimir / Exportar)
                                        </button>

                                        {/* Boton 2: Copiar Texto Formateado */}
                                        <button 
                                            onClick={() => copyFacebookSummaryText(visibleMatches, visibleLeagues, visibleTeams, visiblePlayers, selectedDateFilter, 'PREPARATORIA', activeTournament?.sport || 'Fútbol', getTeamName, showMessage)} 
                                            className="btn-secondary flex-1 min-w-[220px] flex items-center justify-center bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all"
                                        >
                                            📋 Copiar Texto Formateado para Facebook
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const StandingsView = () => {
                const activeTournament = tournaments.find(t => t.id === selectedTournamentId);
                const currentSport = activeTournament?.sport || 'Fútbol';
                const theme = SPORT_THEMES[currentSport] || SPORT_THEMES['Fútbol'];

                const activeLeagueFilter = visibleLeagues.some(l => l.id === selectedStandingsLeagueFilter) ? selectedStandingsLeagueFilter : '';
                const targetLeagues = visibleLeagues.filter(l => activeLeagueFilter ? l.id === activeLeagueFilter : true);
                const targetLeagueIds = targetLeagues.map(l => l.id);
                const targetMatches = visibleMatches.filter(m => targetLeagueIds.includes(m.leagueId));
                const targetTeams = visibleTeams.filter(t => targetLeagueIds.includes(t.leagueId));

                const totalMatchesPlayed = targetMatches.filter(m => m.scoreHome !== null).length;
                const totalGoals = targetMatches.filter(m => m.scoreHome !== null).reduce((sum, m) => sum + (m.scoreHome || 0) + (m.scoreAway || 0), 0);

                // Compute Leader across target leagues
                let leaderDisplay = 'Por definir';
                let leaderFlag = null;

                const allStandings = targetLeagues.flatMap(l => calculateStandings(l.id, visibleTeams, visibleMatches));
                if (allStandings.length > 0) {
                    allStandings.sort((a, b) => b.points - a.points || b.goalDifference - a.goalDifference);
                    const topPoints = allStandings[0].points;
                    const topGD = allStandings[0].goalDifference;
                    
                    if (topPoints > 0) {
                        const leaders = allStandings.filter(t => t.points === topPoints && t.goalDifference === topGD);
                        if (leaders.length === 1) {
                            leaderDisplay = `${leaders[0].teamName} (${leaders[0].points} pts)`;
                            leaderFlag = leaders[0].flagUrl;
                        } else {
                            leaderDisplay = `${leaders.map(t => t.teamName).join(', ')} (${topPoints} pts)`;
                        }
                    }
                }

                // Compute Top Scorer across target leagues
                let topScorerDisplay = 'Por definir';
                const mainSportInfo = getSportScoringInfo(currentSport);
                if (mainSportInfo.showScorers) {
                    const scorersMap = {};
                    targetMatches.forEach(m => {
                        (m.scorers || []).forEach(scorer => {
                            const player = visiblePlayers.find(p => p.id === scorer.playerId);
                            if (player && targetTeams.some(t => t.id === player.teamId)) {
                                if (!scorersMap[scorer.playerId]) {
                                    scorersMap[scorer.playerId] = {
                                        playerName: player.name,
                                        teamName: getTeamName(player.teamId),
                                        goals: 0
                                    };
                                }
                                scorersMap[scorer.playerId].goals += scorer.count;
                            }
                        });
                    });

                    const allScorersList = Object.values(scorersMap).sort((a, b) => b.goals - a.goals);
                    if (allScorersList.length > 0 && allScorersList[0].goals > 0) {
                        const topGoals = allScorersList[0].goals;
                        const topScorers = allScorersList.filter(s => s.goals === topGoals);
                        if (topScorers.length === 1) {
                            topScorerDisplay = `👑 ${topScorers[0].playerName} (${topGoals} ${mainSportInfo.unit})`;
                        } else {
                            topScorerDisplay = `👑 ${topScorers.map(s => s.playerName).join(', ')} (${topGoals} ${mainSportInfo.unit})`;
                        }
                    }
                } else {
                    topScorerDisplay = '🏐 Sin Anotadores en Volley';
                }

                return (
                    <div className="p-2 md:p-4 space-y-8">
                        {/* HERO BANNER CON GRADIENTE DINÁMICO */}
                        <div className={`relative overflow-hidden rounded-3xl bg-gradient-to-br ${theme.gradient} text-white shadow-2xl p-6 md:p-8 border border-white/10`}>
                            <div className="absolute -right-6 -bottom-6 text-9xl opacity-20 pointer-events-none select-none animate-float">
                                {theme.emoji}
                            </div>
                            <div className="absolute top-0 right-1/4 w-96 h-96 bg-white/10 rounded-full blur-3xl pointer-events-none animate-glow"></div>

                            <div className="relative z-10 space-y-4 max-w-3xl">
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="px-3 py-1 text-xs font-black uppercase tracking-wider rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white">
                                        Torneo Oficial
                                    </span>
                                    {activeTournament && (
                                        <span className={`px-3 py-1 text-xs font-bold rounded-full ${theme.badge} backdrop-blur-md`}>
                                            {activeTournament.semester === '1' ? '1er Semestre (Sep - Dic)' : '2do Semestre (Feb - Jun)'}
                                        </span>
                                    )}
                                </div>
                                <h1 className="text-3xl md:text-5xl font-black tracking-tight text-white drop-shadow-md">
                                    {activeTournament ? activeTournament.name : 'Torneos Deportivos La Salle'}
                                </h1>
                                <p className="text-white/80 text-sm md:text-base font-medium max-w-xl">
                                    Sigue las posiciones en tiempo real, últimos marcadores y goleadores del torneo.
                                </p>
                                
                                {tournaments.length > 0 && (
                                    <div className="pt-2">
                                        <label className="block text-xs font-bold uppercase tracking-wider text-white/70 mb-1.5">Seleccionar Torneo:</label>
                                        <select 
                                            value={selectedTournamentId} 
                                            onChange={(e) => setSelectedTournamentId(e.target.value)} 
                                            className="w-full max-w-md p-3 rounded-xl border border-white/30 bg-white/15 backdrop-blur-md text-white font-bold shadow-lg focus:outline-none focus:ring-2 focus:ring-white/50 transition-all cursor-pointer"
                                        >
                                            {tournaments.map(t => <option key={t.id} value={t.id} className="text-gray-900">{t.name}</option>)}
                                        </select>
                                    </div>
                                )}
                            </div>

                            {/* QUICK STATS BAR */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6 pt-6 border-t border-white/15 relative z-10">
                                <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/15">
                                    <p className="text-xs text-white/70 font-semibold uppercase tracking-wider">
                                        {activeLeagueFilter ? 'Líder de Liga' : 'Líder General'}
                                    </p>
                                    <p className="text-base font-black text-white truncate mt-0.5 flex items-center" title={leaderDisplay}>
                                        {leaderFlag && <img src={leaderFlag} className="w-4 h-4 rounded-full mr-1.5 inline flex-shrink-0" />}
                                        <span className="truncate">{leaderDisplay}</span>
                                    </p>
                                </div>
                                <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/15">
                                    <p className="text-xs text-white/70 font-semibold uppercase tracking-wider">
                                        {mainSportInfo.showScorers ? (activeLeagueFilter ? `${mainSportInfo.term} por Liga` : mainSportInfo.leaderTitle) : 'Modalidad'}
                                    </p>
                                    <p className="text-base font-black text-amber-300 truncate mt-0.5" title={topScorerDisplay}>
                                        <span className="truncate">{topScorerDisplay}</span>
                                    </p>
                                </div>
                                <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/15">
                                    <p className="text-xs text-white/70 font-semibold uppercase tracking-wider">Partidos Jugados</p>
                                    <p className="text-xl font-black text-white mt-0.5">{totalMatchesPlayed}</p>
                                </div>
                                <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/15">
                                    <p className="text-xs text-white/70 font-semibold uppercase tracking-wider">
                                        {mainSportInfo.term} Totales
                                    </p>
                                    <p className="text-xl font-black text-emerald-300 mt-0.5">{totalGoals}</p>
                                </div>
                            </div>
                        </div>

                        {tournaments.length === 0 && (
                            <div className="p-8 text-center bg-white dark:bg-gray-800 rounded-3xl shadow-xl">
                                <p className="text-gray-500 dark:text-gray-400 font-semibold">No hay torneos creados aún.</p>
                            </div>
                        )}

                        {visibleLeagues.length > 0 && (
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-2">
                                    <label className="text-xs font-black uppercase tracking-wider text-gray-500 dark:text-gray-400">Filtrar Liga:</label>
                                    <select value={activeLeagueFilter} onChange={(e) => setSelectedStandingsLeagueFilter(e.target.value)} className="p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-bold shadow-sm">
                                        <option value="">Todas las Ligas</option>
                                        {visibleLeagues.sort(sortLeagues).map(league => <option key={league.id} value={league.id}>{league.name}</option>)}
                                    </select>
                                </div>
                            </div>
                        )}

                        {visibleLeagues.filter(l => activeLeagueFilter ? l.id === activeLeagueFilter : true).sort(sortLeagues).map(league => {
                            const leagueSportInfo = getSportScoringInfo(league.sport);
                            return (
                                <div key={league.id} className="bg-white dark:bg-gray-800/80 backdrop-blur-md p-6 rounded-3xl shadow-2xl space-y-6 border border-gray-200/80 dark:border-gray-700/80">
                                    <div className="flex items-center justify-between border-b border-gray-200 dark:border-gray-700/80 pb-3">
                                        <h3 className="text-2xl font-black text-gray-900 dark:text-white flex items-center">
                                            <SportIcon sport={league.sport} />
                                            <span>Liga {league.name}</span>
                                            {league.sport && <span className="text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 ml-3 bg-gray-100 dark:bg-gray-700 px-2.5 py-1 rounded-full">{league.sport}</span>}
                                        </h3>
                                    </div>
                                    <div className="flex flex-col lg:flex-row lg:space-x-6 space-y-6 lg:space-y-0">
                                        <div className="flex-1 space-y-6">
                                            <div>
                                                <h4 className="text-lg font-black text-gray-800 dark:text-gray-200 mb-3 flex items-center">
                                                    <span className="mr-2">📊</span> Clasificación
                                                </h4>
                                                <StandingsTable standings={calculateStandings(league.id, visibleTeams, visibleMatches)} onTeamClick={handleTeamClick} />
                                            </div>
                                            <div>
                                                <h4 className="text-lg font-black text-gray-800 dark:text-gray-200 mb-3 flex items-center">
                                                    <span className="mr-2">⚡</span> Últimos Resultados
                                                </h4>
                                                <ResultsList matches={visibleMatches.filter(m => m.leagueId === league.id)} getTeamName={getTeamName} getTeamFlag={getTeamFlag} onMatchClick={handleMatchClick} />
                                            </div>
                                        </div>
                                        <div className="lg:w-1/3">
                                            <h4 className="text-lg font-black text-gray-800 dark:text-gray-200 mb-3 flex items-center">
                                                <span className="mr-2">👑</span> Tabla de {leagueSportInfo.term}
                                            </h4>
                                            <TopScorersTable scorers={calculateTopScorers(league.id, visibleMatches, visiblePlayers)} sport={league.sport} />
                                        </div>
                                    </div>
                                    {user && <PlayoffManager league={league} matches={visibleMatches} onGenerate={handleGeneratePlayoffs} isLoading={isGeneratingPlayoffs} />}
                                </div>
                            );
                        })}
                    </div>
                );
            };

            const renderView = () => {
                if (isLoading && !isAuthReady) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
                            <div className="animate-spin rounded-full h-32 w-32 border-t-4 border-b-4 border-[#101097]"></div>
                            <p className="mt-4 text-[#101097] dark:text-blue-300 text-lg font-semibold">Cargando Datos...</p>
                        </div>
                    );
                }
                
                switch (view) {
                    case 'standings': return <StandingsView />;
                    case 'admin': return user ? <AdminPanel /> : (
                        <div className="flex items-center justify-center h-[50vh]">
                            <div className="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-sm text-center border-t-4 border-[#101097]">
                                <h3 className="text-2xl font-bold mb-4">Acceso de Administrador</h3>
                                <p className="text-gray-600 dark:text-gray-300 mb-4">Inicia sesión para administrar los torneos.</p>
                                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 mb-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-[#101097]" placeholder="Correo electrónico" />
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') handleLogin(); }} className="w-full p-3 mb-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-[#101097]" placeholder="Contraseña" />
                                <button onClick={handleLogin} className="btn-primary w-full">Ingresar</button>
                            </div>
                        </div>
                    );
                    default: return <StandingsView />;
                }
            };

            const selectedTeam = visibleTeams.find(t => t.id === selectedTeamId);

            return (
                <div className="min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white transition-colors duration-300">
                    <nav className="bg-[#101097] dark:bg-[#001E61] p-4 shadow-lg sticky top-0 z-40 border-b-2 border-white/20 text-white">
                        <div className="flex justify-between items-center max-w-7xl mx-auto">
                             <div className="flex items-center space-x-3">
                                <img src="https://i.imgur.com/pbiHVPL.png" alt="Logo La Salle" className="w-10 h-10 object-contain drop-shadow-md" />
                                <span className="text-white font-extrabold text-xl tracking-wide">Ligas La Salle</span>
                                <span className="text-xs font-bold bg-white/20 text-white px-2.5 py-1 rounded-full uppercase tracking-wider border border-white/30">PREPARATORIA</span>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button onClick={() => setView('standings')} className={`nav-button text-white font-semibold ${view === 'standings' ? 'bg-white/20' : ''}`}>
                                    <TrophyIcon className="inline-block w-5 h-5 mr-2 text-white" />
                                    <span className="text-white">Clasificación</span>
                                </button>
                                {user ? (
                                    <>
                                        <button onClick={() => setView('admin')} className={`nav-button text-white font-semibold ${view === 'admin' ? 'bg-white/20' : ''}`}>
                                            <LockIcon className="inline-block w-5 h-5 mr-2 text-white" />
                                            <span className="text-white">Admin</span>
                                        </button>
                                        <button onClick={handleLogout} className="nav-button text-white font-semibold">
                                            <LockIcon className="inline-block w-5 h-5 mr-2 text-white" />
                                            <span className="text-white">Cerrar Sesión</span>
                                        </button>
                                    </>
                                ) : (
                                    <button onClick={() => setView('admin')} className={`nav-button text-white font-semibold ${view === 'admin' ? 'bg-white/20' : ''}`}>
                                        <LockIcon className="inline-block w-5 h-5 mr-2 text-white" />
                                        <span className="text-white">Admin</span>
                                    </button>
                                )}
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="flex items-center bg-white/10 hover:bg-white/25 transition-all rounded-full px-3.5 py-2 ml-2 shadow-sm border border-white/30 text-white"
                                    title={darkMode ? "Cambiar a Modo Claro" : "Cambiar a Modo Oscuro"}
                                >
                                    {darkMode ? (
                                        <>
                                            <SunIcon className="w-5 h-5 text-yellow-300 mr-1.5" />
                                            <span className="text-xs font-bold text-white">Claro</span>
                                        </>
                                    ) : (
                                        <>
                                            <MoonIcon className="w-5 h-5 text-blue-200 mr-1.5" />
                                            <span className="text-xs font-bold text-white">Oscuro</span>
                                        </>
                                    )}
                                </button>
                            </div>
                        </div>
                    </nav>
                    <main className="max-w-7xl mx-auto py-6 px-4">
                        {renderView()}
                    </main>
                    {selectedTeam && <TeamDetailsModal 
                        team={selectedTeam} 
                        league={visibleLeagues.find(l => l.id === selectedTeam.leagueId)} 
                        players={visiblePlayers} 
                        matches={visibleMatches} 
                        getTeamName={getTeamName} 
                        onClose={() => setSelectedTeamId(null)} 
                        onMatchClick={handleMatchClick} />}
                    {matchDetails && <MatchDetailsModal match={matchDetails} onClose={() => setMatchDetails(null)} getPlayerName={getPlayerName} getTeamName={getTeamName} leagues={visibleLeagues} />}
                    {teamForBulkAdd && <BulkAddPlayersModal team={teamForBulkAdd} onClose={() => setTeamForBulkAdd(null)} appId={appId} db={window.firebaseApp.db} showMessage={showMessage} />}
                    {teamForCountryEdit && <EditTeamCountryModal team={teamForCountryEdit} onClose={() => setTeamForCountryEdit(null)} appId={appId} db={window.firebaseApp.db} showMessage={showMessage} />}
                    <Modal show={showModal} message={modalMessage} onClose={() => setShowModal(false)} />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <!-- Cargar los módulos de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Exportar los módulos a la ventana global para que puedan ser usados en el script de tipo "text/babel"
        window.firebaseModules = {
            initializeApp,
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut,
            getFirestore,
            doc,
            getDoc,
            addDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            collection,
            query,
            where,
            getDocs,
        };
    </script>
</body>
</html>
